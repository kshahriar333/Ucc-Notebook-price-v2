name: UCC Full Laptop Catalogue Price Monitor

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "price_bot.py"
      - "ucc_catalog.py"
      - "retailer_fetcher.py"
      - "ucc_reader.py"
      - "match_engine.py"
      - ".github/workflows/main.yml"
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: ucc-acer-price-monitor
  cancel-in-progress: false

jobs:
  price-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check prices and notify on changes
        run: python price_bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save price history
        run: |
          if git status --porcelain | grep -q "price_history.json"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add price_history.json
            git commit -m "Update Acer price history"
            git push
          else
            echo "No price history changes to commit."
          fi
